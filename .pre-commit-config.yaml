minimum_pre_commit_version: '4.3.0'
repos:
  - repo: local
    hooks:
      - id: xgen-text
        name: X-Gen text and configuration checks
        entry: python tools/quality.py text
        language: system
        types: [text]
        require_serial: true
      - id: xgen-format
        name: X-Gen C and C++ format
        entry: python tools/quality.py format
        language: system
        types_or: [c, c++, header]
        require_serial: true
